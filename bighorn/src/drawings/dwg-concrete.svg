<pattern id="pav" width="36" height="24" patternUnits="userSpaceOnUse"><path d="M0 0H36M0 12H36M0 0V12M18 12V24" stroke="#efe8dc" stroke-opacity=".32" stroke-width="1" fill="none"/></pattern>
<pattern id="wood" width="40" height="8" patternUnits="userSpaceOnUse"><path d="M0 4C10 2 20 6 40 4" stroke="#cfb58a" stroke-opacity=".4" fill="none"/></pattern>
<pattern id="siding" width="20" height="16" patternUnits="userSpaceOnUse"><path d="M0 15.5H20" stroke="#efe8dc" stroke-opacity=".28"/></pattern>
