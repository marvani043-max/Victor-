<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
<style>
.l{fill:none;stroke:#efe8dc;stroke-opacity:.85;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.l2{fill:none;stroke:#efe8dc;stroke-opacity:.4;stroke-width:1.1}
.hid{fill:none;stroke:#efe8dc;stroke-opacity:.5;stroke-width:1.3;stroke-dasharray:7 5}
.sand{stroke:#cfb58a;stroke-opacity:1}.clay{stroke:#dd7a2f;stroke-opacity:1}.grn{stroke:#8a9663;stroke-opacity:1}
.water{fill:none;stroke:#9fb4ba;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{font:500 15px 'IBM Plex Mono',monospace;fill:#b6ab9c;letter-spacing:.03em;paint-order:stroke;stroke:#1e1814;stroke-width:6px;stroke-linejoin:round}
.tb{fill:#efe8dc}.tc{fill:#eb8b41}.ts{fill:#cfb58a}.tw{fill:#9fb4ba}
.sm{font-size:12px;letter-spacing:.14em}
.h{font:600 30px 'Archivo',sans-serif;font-stretch:112%;fill:#efe8dc;letter-spacing:-.01em}
.dot{fill:#cfb58a}.lead{fill:none;stroke:#cfb58a;stroke-width:1.2}
.dim path{fill:none;stroke:#efe8dc;stroke-opacity:.6;stroke-width:1.1}
</style>
<defs>
<pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#efe8dc" fill-opacity=".07"/></pattern>
<pattern id="soil" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#efe8dc" stroke-opacity=".17" stroke-width="1.2"/></pattern>
<pattern id="gravel" width="34" height="26" patternUnits="userSpaceOnUse"><path d="M4 7l5-3 5 2-1 5-7 1z M20 4l6 1 2 4-3 3-5-2z M12 17l5-1 3 4-4 3-4-2z M27 16l4 1 1 4-4 1z" fill="#efe8dc" fill-opacity=".06" stroke="#efe8dc" stroke-opacity=".34"/></pattern>
<pattern id="conc" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="1" fill="#efe8dc" fill-opacity=".45"/><circle cx="15" cy="9" r=".8" fill="#efe8dc" fill-opacity=".35"/><circle cx="9" cy="17" r="1.1" fill="#efe8dc" fill-opacity=".4"/><path d="M17 16l3 4h-5z" fill="none" stroke="#efe8dc" stroke-opacity=".35"/></pattern>
